name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read # GitHub Actions may read my repository files.
  id-token: write # The GitHub Actions workflow is allowed to request an OIDC token from GitHub.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t fraud-detection-api .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/841926338477/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions@project-3a71b75d-ddfe-4bce-941.iam.gserviceaccount.com"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Tag Docker image
        run: docker tag fraud-detection-api europe-west1-docker.pkg.dev/project-3a71b75d-ddfe-4bce-941/fraud-detection-api/fraud-detection-api:latest

      - name: Push Docker image
        run: docker push europe-west1-docker.pkg.dev/project-3a71b75d-ddfe-4bce-941/fraud-detection-api/fraud-detection-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fraud-detection-api \
            --image europe-west1-docker.pkg.dev/project-3a71b75d-ddfe-4bce-941/fraud-detection-api/fraud-detection-api:latest \
            --region europe-west1 \
            --platform managed \
            --port 8000